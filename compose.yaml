services:
  whoop:
    build: .
    environment:
      # 都可不设：PUBLIC_URL 按访问域名自动识别；ADMIN_PASSWORD 不设时首次打开网页自己设密码
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SETUP_CODE: ${SETUP_CODE:-}
      CRON_SECRET: ${CRON_SECRET:-}
      AUTOMATION_SECRET: ${AUTOMATION_SECRET:-}
      DATA_ROOT: /data
      PORT: "8080"
    ports:
      - "127.0.0.1:8788:8080"
    volumes:
      - whoop-data:/data
volumes:
  whoop-data:
